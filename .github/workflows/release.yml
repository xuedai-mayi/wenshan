name: release

# 打 tag 即发布：跑全链路测试 → 构建镜像 → 产出源码包 → 建 GitHub Release。
# 想同时推到镜像仓库时，在仓库 Secrets 里配 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，
# 并把下面「推送镜像」一步的 if 打开。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: 发布前自检
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm run setup -- --yes
      - run: npm test
      - run: npm run test:integration
      - name: 版本号与 tag 一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

  image:
    name: 构建容器镜像
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wenshan:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟：容器起来后 /wenshan/api/health 应为 ok
        run: |
          docker run -d --name wenshan-smoke -p 3080:3080 wenshan:${{ github.ref_name }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3080/wenshan/api/health | grep -q '"status":"ok"'; then
              echo "health ok"; docker rm -f wenshan-smoke; exit 0
            fi
            sleep 2
          done
          docker logs wenshan-smoke | tail -50
          docker rm -f wenshan-smoke
          exit 1
      # 推镜像（按需打开）：
      # - uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      # - run: docker tag wenshan:${{ github.ref_name }} ${{ secrets.DOCKERHUB_USERNAME }}/wenshan:${GITHUB_REF_NAME#v}
      # - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/wenshan:${GITHUB_REF_NAME#v}

  publish:
    name: 发布源码包与 Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包源码（不含本地状态与依赖）
        run: |
          git archive --format=tar.gz --prefix="wenshan-${GITHUB_REF_NAME#v}/" \
            -o "wenshan-${GITHUB_REF_NAME#v}-src.tar.gz" HEAD
      - name: 生成校验和
        run: sha256sum "wenshan-${GITHUB_REF_NAME#v}-src.tar.gz" > "wenshan-${GITHUB_REF_NAME#v}-src.tar.gz.sha256"
      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 问山 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            wenshan-*.tar.gz
            wenshan-*.tar.gz.sha256
