# 问山：地理野外实习自成长智能助手的产品挂载层。
# 业务工具由两个 agent preset 隔离；宿主提供资料夹收录与知识图谱视图。
#
# 启动器（bin/wenshan.mjs → scripts/lib/overlay.mjs）在启动时把本文件里的五处占位符
# 替换成本机真实值：两个插件入口、提取器路径、Python 可执行文件、解释器前置参数。
# 占位符清单见 scripts/lib/overlay.mjs 的 PLACEHOLDERS；因此同一份配置在
# Windows / macOS / Linux 通用，不需要 bat 里拼字符串，也不用为 Python 版本改配置。
# 想确认实际渲染结果：npm start -- --dry-run。
- id: agent-presets
  config:
    default: field-qa
    roots:
      - path: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'agents')
        trust: system
    includeUserRoot: false

- insert:
    - id: georag
      name: __WENSHAN_GEORAG_PLUGIN__
      config:
        dataDir: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'data')
        # 上传即构建：资料落库后用「设置 > 模型」当前选择的模型抽取知识草稿。
        # 这里只控制分块与并发，模型和凭据都由宿主提供，插件不读任何密钥。
        build:
          enabled: true
          maxChars: 2500      # 单块目标字数
          maxChunks: 60       # 单份资料最多抽取多少块，超了等距抽样
          concurrency: 2      # 同时在飞的模型调用数
          maxTokens: 8000     # 单次抽取的输出上限（关掉思考后仍要大一点，避免长块被截断）

    - id: wenshan-intake
      name: __WENSHAN_INTAKE_PLUGIN__
      config:
        extractorPath: __WENSHAN_EXTRACTOR_PATH__
        python: __WENSHAN_PYTHON__
        pythonArgs: __WENSHAN_PYTHON_ARGS__
        maxUploadBytes: 209715200
        extractTimeoutMs: 1800000
