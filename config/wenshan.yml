# 问山：地理野外实习自成长智能助手产品挂载层。
# 业务工具由两个 agent preset 隔离；宿主提供资料夹收录与知识图谱视图。
- id: agent-presets
  config:
    default: field-qa
    roots:
      - path: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'agents')
        trust: system
    includeUserRoot: false

- insert:
    - id: georag
      name: '__WENSHAN_GEORAG_PLUGIN__'
      config:
        dataDir: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'data')

    - id: wenshan-intake
      name: '__WENSHAN_INTAKE_PLUGIN__'
      config:
        extractorPath: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'scripts/extract_source.py')
        python: !!js "process.platform === 'win32' ? 'py' : 'python3.11'"
        pythonArgs: !!js "process.platform === 'win32' ? ['-3.11'] : []"
        maxUploadBytes: 209715200
        extractTimeoutMs: 1800000
